<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>תשלום</title>

  <style>
    :root{
      --bg:#0f1115;
      --card:#151821;
      --panel:#10131a;
      --border:#262a33;
      --text:#e5e7eb;
      --muted:#9ca3af;

      --blue-border:#4f7cff;
      --blue-top:#2f4dbb;
      --blue-bottom:#243b8f;
      --blue-text:#e8eeff;

      --wa:#25D366;
      --wa-dark:#1da851;

      --ok:#22c55e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at top,#1a1d24,#0f1115);
      font-family: Arial, "Heebo", "Rubik", sans-serif;
      color:var(--text);
    }

    .wrap{
      width:100%;
      max-width:820px;
      padding:32px 16px;
    }

    .card{
      background:linear-gradient(180deg,#181b22,#13151a);
      border:1px solid var(--border);
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 50px rgba(0,0,0,0.6);
      text-align:center;
    }

    h1{
      margin:0;
      font-size:24px;
      font-weight:800;
      letter-spacing:0.2px;
    }

    .subnote{
      margin-top:12px;
      font-size:13px;
      color:var(--muted);
    }

    .divider{
      height:1px;
      background:rgba(255,255,255,0.10);
      margin:20px 0 22px;
    }

    .section{
      background:var(--panel);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
    }

    .title{
      font-weight:800;
      margin:0 0 14px 0;
      font-size:15px;
      text-align:center;
    }

    .kv{
      text-align:right;
      font-size:14px;
      line-height:2;
      margin:0;
    }

    .kv b{
      color:var(--muted);
      display:inline-block;
      min-width:120px;
      font-weight:800;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-top:14px;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:999px;
      padding:13px 26px;
      cursor:pointer;
      font-weight:800;
      font-size:14px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      user-select:none;
    }

    .btn-blue{
      border:1.5px solid var(--blue-border);
      background:linear-gradient(180deg,var(--blue-top),var(--blue-bottom));
      color:var(--blue-text);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 26px rgba(0,0,0,0.6);
      transition:transform .15s, filter .15s;
    }
    .btn-blue:hover{filter:brightness(1.1)}
    .btn-blue:active{transform:translateY(1px)}

    .btn-wa{
      background:linear-gradient(180deg,var(--wa),var(--wa-dark));
      color:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 26px rgba(0,0,0,0.6);
      transition:transform .15s, filter .15s;
    }
    .btn-wa:hover{filter:brightness(1.08)}
    .btn-wa:active{transform:translateY(1px)}

    .copied{
      display:none;
      font-size:13px;
      font-weight:900;
      color:var(--ok);
      margin-right:6px;
    }
    .copied.show{display:inline-block}
  </style>

  <script>
    const WA_NUMBER = "972545764327";
    const CARD_LINK = "https://mrng.to/qEDloOpwYy";

    const BANK = {
      name: "ריצארד טומסקי",
      bank: "פועלים",
      branch: "632",
      account: "273277"
    };

    const BIT_NUMBER = "0545764327";

    function getClientName(){
      const p = new URLSearchParams(window.location.search);
      return (p.get("name") || p.get("client") || "").trim() || "_____";
    }

    function init(){
      const name = getClientName();
      const msg = `היי, זה ${name} ביצעתי תשלום מצרף אסמכתא`;
      document.getElementById("waBtn").href =
        `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
    }

    async function copyToClipboard(text, feedbackId){
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const el = document.getElementById(feedbackId);
      if(el){
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1400);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <h1>תשלום</h1>
      <div class="subnote">יש להוסיף מע״מ</div>

      <div class="divider"></div>

      <!-- BANK FIRST -->
      <div class="section">
        <div class="title">העברה בנקאית</div>

        <div class="kv">
          <div><b>שם:</b> <span id="b_name">ריצארד טומסקי</span></div>
          <div><b>בנק:</b> <span id="b_bank">פועלים</span></div>
          <div><b>סניף:</b> <span id="b_branch">632</span></div>
          <div><b>חשבון:</b> <span id="b_account">273277</span></div>
        </div>

        <div class="row">
          <button class="btn btn-blue" onclick="copyToClipboard(BANK.name,'c_name')">העתק שם</button>
          <button class="btn btn-blue" onclick="copyToClipboard(BANK.bank,'c_bank')">העתק בנק</button>
          <button class="btn btn-blue" onclick="copyToClipboard(BANK.branch,'c_branch')">העתק סניף</button>
          <button class="btn btn-blue" onclick="copyToClipboard(BANK.account,'c_account')">העתק חשבון</button>
        </div>

        <div style="margin-top:10px;text-align:center;">
          <span class="copied" id="c_name">✓ הועתק</span>
          <span class="copied" id="c_bank">✓ הועתק</span>
          <span class="copied" id="c_branch">✓ הועתק</span>
          <span class="copied" id="c_account">✓ הועתק</span>
        </div>
      </div>

      <!-- BIT -->
      <div class="section">
        <div class="title">Bit</div>

        <div class="kv" style="text-align:center;">
          <div><b style="min-width:auto;">מספר להעברה בביט:</b> 0545764327</div>
        </div>

        <div class="row">
          <button class="btn btn-blue" onclick="copyToClipboard(BIT_NUMBER,'c_bit')">העתק מספר לביט</button>
          <span class="copied" id="c_bit">✓ הועתק</span>
        </div>
      </div>

      <!-- CARD LAST -->
      <div class="section">
        <div class="title">תשלום באשראי</div>

        <div class="row">
          <a class="btn btn-blue" href="https://mrng.to/qEDloOpwYy" target="_blank" rel="noopener">
            לתשלום באשראי
          </a>

          <button class="btn btn-blue" onclick="copyToClipboard(CARD_LINK,'c_card')">
            העתק לינק אשראי
          </button>

          <span class="copied" id="c_card">✓ הועתק</span>
        </div>
      </div>

      <!-- WHATSAPP RECEIPT -->
      <div class="section" style="margin-bottom:0;">
        <div class="title">שליחת אסמכתא</div>

        <div class="row">
          <a class="btn btn-wa" id="waBtn" href="#" target="_blank" rel="noopener">
            שליחת אסמכתא ב WhatsApp
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
