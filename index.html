<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תשלום</title>

<style>
:root{
  --bg:#0f1115;
  --card:#13161d;
  --panel:#10131a;
  --border:#262a33;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --blue:#4f7cff;
  --green:#25D366;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1a1d24,#0f1115);
  font-family:Arial,"Heebo","Rubik",sans-serif;
  color:var(--text);
  display:flex;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:820px;
  padding:32px 16px;
}

.card{
  background:linear-gradient(180deg,#181b22,#13151a);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  text-align:center;
}

h1{
  margin:0;
  font-size:24px;
  font-weight:800;
}

.note{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

.section{
  background:var(--panel);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:18px;
  margin-top:16px;
}

.section-title{
  font-weight:800;
  margin-bottom:14px;
  text-align:center;
}

.kv{
  display:grid;
  grid-template-columns: 120px 1fr 34px;
  align-items:center;
  gap:8px;
  padding:6px 0;
  text-align:right;
}

.label{
  font-weight:800;
  color:var(--muted);
}

.value{
  font-weight:400;
}

.copy{
  width:30px;
  height:30px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  color:#cbd5e1;
  background:rgba(255,255,255,.03);
  transition:.15s ease;
}

.copy:hover{
  background:rgba(79,124,255,.12);
  color:var(--blue);
  border-color:rgba(79,124,255,.6);
  transform:translateY(-1px);
}

.ok{
  grid-column:1 / -1;
  font-size:12px;
  color:#22c55e;
  display:none;
  margin-top:4px;
}

.ok.show{display:block}

.center{
  text-align:center;
}

.btn{
  display:inline-block;
  padding:14px 36px;
  border-radius:999px;
  font-weight:800;
  text-decoration:none;
  color:#fff;
  border:none;
  cursor:pointer;
  transition:.15s ease;
}

.btn:hover{
  filter:brightness(1.1);
  transform:translateY(-1px);
}

.btn-blue{
  background:linear-gradient(180deg,#2f4dbb,#243b8f);
}

.btn-green{
  background:linear-gradient(180deg,#25D366,#1da851);
}

</style>

<script>
async function copyText(text,id){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const t=document.createElement("textarea");
    t.value=text;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    document.body.removeChild(t);
  }
  const el=document.getElementById(id);
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1200);
}

window.onload=()=>{
  const msg="היי, זה ביצעתי תשלום מצרף אסמכתא";
  document.getElementById("wa").href=
    "https://wa.me/972545764327?text="+encodeURIComponent(msg);
}
</script>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>תשלום</h1>
<div class="note">יש להוסיף מע״מ</div>

<!-- BANK -->
<div class="section">
  <div class="section-title">העברה בנקאית</div>

  <div class="kv">
    <div class="label">שם:</div>
    <div class="value">ריצארד טומסקי</div>
    <div class="copy" onclick="copyText('ריצארד טומסקי','ok1')">⧉</div>
    <div class="ok" id="ok1">✓ הועתק</div>
  </div>

  <div class="kv">
    <div class="label">בנק:</div>
    <div class="value">פועלים</div>
    <div class="copy" onclick="copyText('פועלים','ok2')">⧉</div>
    <div class="ok" id="ok2">✓ הועתק</div>
  </div>

  <div class="kv">
    <div class="label">סניף:</div>
    <div class="value">632</div>
    <div class="copy" onclick="copyText('632','ok3')">⧉</div>
    <div class="ok" id="ok3">✓ הועתק</div>
  </div>

  <div class="kv">
    <div class="label">חשבון:</div>
    <div class="value">273277</div>
    <div class="copy" onclick="copyText('273277','ok4')">⧉</div>
    <div class="ok" id="ok4">✓ הועתק</div>
  </div>
</div>

<!-- BIT -->
<div class="section">
  <div class="section-title">העברה בביט</div>

  <div class="kv">
    <div class="label">מס טלפון להעברה: </div>
    <div class="value">0545764327</div>
    <div class="copy" onclick="copyText('0545764327','ok5')">⧉</div>
    <div class="ok" id="ok5">✓ הועתק</div>
  </div>
</div>

<!-- CARD -->
<div class="section center">
  <div class="section-title">תשלום באשראי</div>
  <a href="#" class="btn btn-blue">לתשלום באשראי</a>
</div>

<!-- WHATSAPP -->
<div class="section center">
  <div class="section-title">שליחת אסמכתא</div>
  <a id="wa" class="btn btn-green">שליחת אסמכתא ב-WhatsApp</a>
</div>

</div>
</div>
</body>
</html>
