<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>תשלום</title>

  <link rel="icon" href="favicon.png" />

  <style>
    :root{
      --bg:#0f1115;
      --panel:#10131a;
      --border:#262a33;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --blue:#4f7cff;
      --wa:#25D366;
      --ok:#22c55e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      background:radial-gradient(circle at top,#1a1d24,#0f1115);
      font-family:Arial,"Heebo","Rubik",sans-serif;
      color:var(--text);
    }

    .wrap{
      width:100%;
      max-width:820px;
      padding:32px 16px;
    }

    .card{
      background:linear-gradient(180deg,#181b22,#13151a);
      border:1px solid var(--border);
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
      text-align:center;
    }

    h1{margin:0;font-size:24px;font-weight:800}
    .note{margin-top:12px;font-size:13px;color:var(--muted)}

    .section{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;
      padding:18px;
      margin-top:16px;
    }

    /* titles stay centered */
    .title{
      font-weight:800;
      margin-bottom:14px;
      text-align:center;
    }

    /* content blocks are right-aligned */
    .content-right{
      text-align:right;
    }

    /* bank rows */
    .kvrow{
      display:flex;
      align-items:center;
      justify-content:flex-start; /* rtl: start is right */
      gap:10px;
      padding:6px 0;
      font-size:14px;
    }

    .label{
      color:var(--muted);
      min-width:90px;
    }

    .value{
      font-weight:700;
    }

    /* copy controls should stick to the number/value */
    .copywrap{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .copy{
      width:22px;
      height:22px;
      border:1px solid rgba(255,255,255,.2);
      border-radius:6px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:12px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .copy:hover{
      border-color:var(--blue);
      color:var(--blue);
    }

    .ok{
      font-size:12px;
      color:var(--ok);
      display:none;
      font-weight:900;
    }
    .ok.show{display:inline}

    /* centered buttons */
    .btn{
      display:inline-block;
      padding:14px 36px;
      border-radius:999px;
      font-weight:800;
      text-decoration:none;
      color:#fff;
      border:none;
      cursor:pointer;
    }

    .btn-blue{
      background:linear-gradient(180deg,#2f4dbb,#243b8f);
      box-shadow:0 10px 26px rgba(0,0,0,.6);
    }

    .btn-wa{
      background:linear-gradient(180deg,#25D366,#1da851);
      box-shadow:0 10px 26px rgba(0,0,0,.6);
    }

    .center{
      text-align:center;
    }
  </style>

  <script>
    async function copy(text,id){
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta=document.createElement("textarea");
        ta.value=text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const el=document.getElementById(id);
      if(!el) return;
      el.classList.add("show");
      setTimeout(()=>el.classList.remove("show"),1200);
    }

    window.onload=()=>{
      const name=new URLSearchParams(location.search).get("name")||"_____";
      const msg=`היי, זה ${name} ביצעתי תשלום מצרף אסמכתא`;
      document.getElementById("wa").href=
        "https://wa.me/972545764327?text="+encodeURIComponent(msg);
    }
  </script>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <h1>תשלום</h1>
      <div class="note">יש להוסיף מע״מ</div>

      <!-- BANK -->
      <div class="section">
        <div class="title">העברה בנקאית</div>

        <div class="content-right">
          <div class="kvrow">
            <div class="label">שם</div>
            <div class="copywrap">
              <div class="value">ריצארד טומסקי</div>
              <span class="copy" onclick="copy('ריצארד טומסקי','ok1')">⧉</span>
              <span class="ok" id="ok1">✓</span>
            </div>
          </div>

          <div class="kvrow">
            <div class="label">בנק</div>
            <div class="copywrap">
              <div class="value">פועלים</div>
              <span class="copy" onclick="copy('פועלים','ok2')">⧉</span>
              <span class="ok" id="ok2">✓</span>
            </div>
          </div>

          <div class="kvrow">
            <div class="label">סניף</div>
            <div class="copywrap">
              <div class="value">632</div>
              <span class="copy" onclick="copy('632','ok3')">⧉</span>
              <span class="ok" id="ok3">✓</span>
            </div>
          </div>

          <div class="kvrow">
            <div class="label">חשבון</div>
            <div class="copywrap">
              <div class="value">273277</div>
              <span class="copy" onclick="copy('273277','ok4')">⧉</span>
              <span class="ok" id="ok4">✓</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BIT -->
      <div class="section">
        <div class="title">Bit</div>

        <div class="content-right">
          <div class="kvrow" style="justify-content:flex-start;">
            <div class="copywrap">
              <div class="value">מספר להעברה בביט: 0545764327</div>
              <span class="copy" onclick="copy('0545764327','ok5')">⧉</span>
              <span class="ok" id="ok5">✓</span>
            </div>
          </div>
        </div>
      </div>

      <!-- CARD -->
      <div class="section">
        <div class="title">תשלום באשראי</div>
        <div class="center">
          <a class="btn btn-blue" href="https://mrng.to/qEDloOpwYy" target="_blank" rel="noopener">
            לתשלום באשראי
          </a>
        </div>
      </div>

      <!-- WHATSAPP -->
      <div class="section">
        <div class="title">שליחת אסמכתא</div>
        <div class="center">
          <a class="btn btn-wa" id="wa" href="#" target="_blank" rel="noopener">
            שליחת אסמכתא ב WhatsApp
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
